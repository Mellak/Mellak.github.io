# Each popup is rendered next to its publication by _layouts/bib.liquid and opened by the
# animated icon, the "Project" button, or a link such as /publications/#ddconv.
#
# id:            URL hash and popup id
# bib:           key of the publication in papers.bib (its links, icon and BibTeX are used)
# venue, year:   badge at the top of the popup
# authors[].aff: indexes into affiliations (1-based)
# figures:       kind (method | results), src (in assets/img/projects/), width, height, alt,
