layout: none
permalink: /projects/
sitemap: false
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting to Publications</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ '/publications/' | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ '/publications/' | relative_url }}">
    <script>
      location.replace("{{ '/publications/' | relative_url }}" + location.hash);
    </script>
  </head>
  <body>
    <p>Projects are now part of <a href="{{ '/publications/' | relative_url }}">Publications</a>.</p>
  </body>
</html>
